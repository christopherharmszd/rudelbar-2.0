<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Dein Rudelbar-Abend: Angebote, Spiele, Musik und die Getränkekarte vor Ort.">
  <title>Rudelbar · Dein Abend</title>
  <link rel="icon" href="/assets/rudelbar-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/rudelbar-logo.png">
  <link rel="stylesheet" href="/styles.css?v=101">
  <link rel="stylesheet" href="/notifications.css?v=1">
  <script defer src="/assets/lucide.js"></script>
  <script defer src="/app.js?v=101"></script>
</head>
<body>
  <div id="rudelbar-event-scharnebeck" class="re-app" data-view="welcome" aria-label="Rudelbar: Dein Abend in Scharnebeck">
    <header class="re-header">
      <div class="re-header-inner">
        <button type="button" class="re-brand" data-action="go" data-view="home" aria-label="Zur Abendübersicht">
          <img src="/assets/rudelbar-logo.png" alt="Rudelbar Wolfslogo" width="44" height="52">
          <span>RUDEL BAR<small>DIE MOBILE KNEIPE</small></span>
        </button>
        <span class="re-header-place">Dein Abend in<strong>…</strong></span>
        <span data-notice-slot></span>
      </div>
    </header>
    <div class="re-notice-banner" data-notice-banner></div>
    <main id="re-screen" class="re-screen" aria-live="polite"></main>
    <nav id="re-nav" class="re-nav" aria-label="Hauptnavigation" hidden>
      <button type="button" data-action="go" data-view="home"><i data-lucide="house" aria-hidden="true"></i><span>Heute</span></button>
      <button type="button" data-action="go" data-view="people"><i data-lucide="users-round" aria-hidden="true"></i><span>Begegnungen</span></button>
      <button type="button" data-action="go" data-view="evening"><i data-lucide="heart" aria-hidden="true"></i><span>Mein Abend</span></button>
      <button type="button" data-action="go" data-view="help"><i data-lucide="hand-heart" aria-hidden="true"></i><span>Hilfe</span></button>
    </nav>
  </div>
  <noscript><p>Aktiviere bitte JavaScript, um deinen Rudelbar-Abend zu entdecken.</p></noscript>
</body>
</html>
