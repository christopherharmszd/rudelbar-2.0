    <style>
      .legal-header {
        display: flex;

        justify-content: space-between;

      .legal-main h2 { margin: 0 0 0.8rem; color: #f5f1e9; font-size: 1.4rem; }
      .legal-main address { font-style: normal; line-height: 1.7; }
      .legal-main a { color: #e4b455; text-decoration: underline; text-underline-offset: 3px; }
      .legal-footer { padding: 1.25rem clamp(1.25rem, 4vw, 4.5rem); }
