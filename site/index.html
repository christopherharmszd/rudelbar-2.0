<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <link rel="icon" type="image/png" href="./rudelbar-logo.png" />
    <title>Rudel Bar</title>
    <script type="module" crossorigin src="./index-C-0Vpobj.js"></script>
    <link rel="stylesheet" crossorigin href="./index-CUX3kLXj.css">
    <style>
      html[data-theme="black"] .booking-form input[type="date"],
      html[data-theme="dusk"] .booking-form input[type="date"],
      html[data-theme="evening"] .booking-form input[type="date"] {
        color-scheme: dark;
      }
      .legal-links {
        display: flex;
        justify-content: flex-end;
        padding: 0 clamp(1.25rem, 4vw, 4.5rem) 1.25rem;
        background: var(--cream, #0d0d0d);
        color: var(--muted, #c6c0b6);
        font: 0.78rem Arial, sans-serif;
      }
      .legal-links a:hover,
      .legal-links a:focus-visible {
        color: var(--ochre, #d39a22);
        text-decoration: underline;
      }
      html[data-theme] .team-grid {
        background: var(--paper);
        gap: 0;
      }
      .team-grid article:nth-child(odd):not(:last-child) {
        border-right: 1px solid var(--line);
      }
      .team-grid article:nth-child(-n+4) {
        border-bottom: 1px solid var(--line);
      }
      .team-grid article {
        display: grid;
        grid-template-columns: minmax(145px, 34%) minmax(0, 1fr);
        grid-template-rows: auto auto 1fr;
        column-gap: 1.5rem;
        align-content: start;
        min-height: 280px;
      }
      .team-grid article:last-child {
        grid-template-columns: 190px minmax(0, 1fr);
      }
      .team-grid .team-number {
        display: none;
      }
      .team-grid .team-photo {
        grid-column: 1;
        grid-row: 1 / 4;
        display: block;
        width: 100%;
        height: 220px;
        margin: 0;
        border-radius: 3px;
        object-fit: cover;
        object-position: center 32%;
        background: #201e1b;
      }
      .team-grid article h2 {
        grid-column: 2;
        grid-row: 1;
      }
      .team-grid article .team-role {
        grid-column: 2;
        grid-row: 2;
        margin: 0 0 1rem;
      }
      .team-grid article p:not(.team-number):not(.team-role) {
        grid-column: 2;
        grid-row: 3;
        max-width: 56ch;
        margin: 0;
      }
      @media (max-width: 760px) {
        .team-grid article:nth-child(odd):not(:last-child) {
          border-right: 0;
        }
        .team-grid article,
        .team-grid article:last-child {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: none;
        }
        .team-grid .team-photo {
          grid-column: 1;
          grid-row: auto;
          height: clamp(220px, 65vw, 320px);
          margin-bottom: 1.25rem;
        }
        .team-grid article h2,
        .team-grid article .team-role,
        .team-grid article p:not(.team-number):not(.team-role) {
          grid-column: 1;
          grid-row: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <nav class="legal-links" aria-label="Rechtliches">
      <a href="./impressum.html">Impressum</a>
    </nav>
    <script>
      (() => {
        const teamRoot = document.getElementById('root');
        const teamPhotos = {
          Martin: './team-martin.png',
          Jan: './team-jan.png',
          Jannik: './team-jannik.png',
          Paddy: './team-paddy.png',
          Patryk: './team-patryk-portrait-v1.png',
        };
        const addTeamPhotos = () => {
          for (const card of teamRoot.querySelectorAll('.team-grid article')) {
            const name = card.querySelector('h2')?.textContent.trim();
            if (!teamPhotos[name] || card.querySelector('.team-photo')) continue;
            const photo = document.createElement('img');
            photo.src = teamPhotos[name];
            photo.alt = `${name} aus dem Rudelbar-Team`;
            photo.className = 'team-photo';
            photo.loading = 'lazy';
            card.prepend(photo);
          }
        };
        new MutationObserver(addTeamPhotos).observe(teamRoot, { childList: true, subtree: true });
        addTeamPhotos();
      })();
    </script>
    <script src="./web3forms.js" defer></script>
  </body>
</html>
